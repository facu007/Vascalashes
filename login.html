<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vasca — Iniciar sesión</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="icon" href="favicon.svg" type="image/svg+xml">
  <style>
    :root {
      --bg: #0f0e0d; --card: rgba(30,27,24,0.95); --line: rgba(255,245,235,0.08);
      --text: #f5efe8; --text-soft: #c4b5a5; --muted: #8a7a6c; --accent: #c9a88e;
      --accent-glow: rgba(201,168,142,0.15); --red: #ff6b6b; --green: #6bcb77;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh; display: flex; align-items: center; justify-content: center;
      font-family: "Manrope", sans-serif; color: var(--text); background: var(--bg);
      background-image: radial-gradient(circle at 30% 20%, rgba(201,168,142,0.06) 0%, transparent 50%),
                        radial-gradient(circle at 70% 80%, rgba(201,168,142,0.04) 0%, transparent 50%);
    }
    .container { width: 100%; max-width: 420px; padding: 20px; animation: fadeIn 0.6s ease; }
    @keyframes fadeIn { from { opacity:0; transform:translateY(20px); } to { opacity:1; transform:translateY(0); } }
    .brand-header { text-align: center; margin-bottom: 36px; }
    .brand-header img { width: 56px; height: 56px; border-radius: 50%; border: 2px solid var(--line); margin-bottom: 14px; }
    .brand-header h1 { font-family: "Cormorant Garamond", serif; font-size: 2.2rem; letter-spacing: -0.02em; }
    .brand-header p { color: var(--muted); font-size: 0.88rem; margin-top: 6px; }
    .tabs { display: flex; gap: 4px; margin-bottom: 28px; background: var(--card); border-radius: 12px; padding: 4px; border: 1px solid var(--line); }
    .tab {
      flex: 1; padding: 12px; border: none; background: transparent; color: var(--muted);
      font: inherit; font-size: 0.88rem; font-weight: 600; border-radius: 10px;
      cursor: pointer; transition: all 0.3s;
    }
    .tab.active { background: var(--accent); color: var(--bg); }
    .form-card { background: var(--card); border: 1px solid var(--line); border-radius: 18px; padding: 28px; }
    .form-card.hidden { display: none; }
    .form-group { margin-bottom: 16px; }
    .form-group label { display: block; margin-bottom: 6px; font-size: 0.78rem; color: var(--muted); text-transform: uppercase; letter-spacing: 0.06em; }
    .form-group input {
      width: 100%; padding: 13px 14px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg);
      color: var(--text); font: inherit; font-size: 0.92rem; transition: border-color 0.3s;
    }
    .form-group input:focus { outline: none; border-color: var(--accent); }
    .btn-submit {
      width: 100%; padding: 14px; border-radius: 12px; border: none;
      background: var(--accent); color: var(--bg); font: inherit;
      font-weight: 700; font-size: 0.92rem; cursor: pointer;
      transition: all 0.3s; text-transform: uppercase; letter-spacing: 0.08em;
    }
    .btn-submit:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(201,168,142,0.3); }
    .btn-submit:disabled { opacity: 0.5; cursor: not-allowed; transform: none; }
    .status { margin-top: 12px; font-size: 0.85rem; text-align: center; min-height: 20px; }
    .status.error { color: var(--red); }
    .status.success { color: var(--green); }
    .home-link { display: block; text-align: center; margin-top: 24px; color: var(--muted); font-size: 0.82rem; transition: color 0.3s; }
    .home-link:hover { color: var(--accent); }
  </style>
</head>
<body>
  <div class="container">
    <div class="brand-header">
      <img src="vasca-avatar.jpg" alt="Vasca">
      <h1>Vasca</h1>
      <p>Lashes & Eyebrows</p>
    </div>

    <div class="tabs">
      <button class="tab active" onclick="switchTab('login')">Iniciar sesión</button>
      <button class="tab" onclick="switchTab('register')">Registrarse</button>
    </div>

    <div class="form-card" id="form-login">
      <form onsubmit="handleLogin(event)">
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="login-email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="login-pass" required placeholder="••••••••">
        </div>
        <button type="submit" class="btn-submit" id="btn-login">Ingresar</button>
        <div class="status" id="login-status"></div>
      </form>
    </div>

    <div class="form-card hidden" id="form-register">
      <form onsubmit="handleRegister(event)">
        <div class="form-group">
          <label>Nombre completo</label>
          <input type="text" id="reg-name" required placeholder="Tu nombre">
        </div>
        <div class="form-group">
          <label>Teléfono</label>
          <input type="tel" id="reg-phone" required placeholder="11 1234-5678">
        </div>
        <div class="form-group">
          <label>Email</label>
          <input type="email" id="reg-email" required placeholder="tu@email.com">
        </div>
        <div class="form-group">
          <label>Contraseña</label>
          <input type="password" id="reg-pass" required placeholder="Mínimo 6 caracteres" minlength="6">
        </div>
        <button type="submit" class="btn-submit" id="btn-register">Crear cuenta</button>
        <div class="status" id="reg-status"></div>
      </form>
    </div>

    <a href="index.html" class="home-link">← Volver al sitio</a>
  </div>

  <script>
    const SB_URL = "https://mxoztaxlcciqrdejfpum.supabase.co";
    const SB_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6Im14b3p0YXhsY2NpcXJkZWpmcHVtIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzg2MTQ3NzksImV4cCI6MjA5NDE5MDc3OX0.bwE9e5P2UvqAC9VauZVk1q6j19mnDkAptXMOTEiKhJA";

    function switchTab(tab) {
      document.querySelectorAll(".tab").forEach((button, index) => {
        button.classList.toggle("active", (tab === "login" && index === 0) || (tab === "register" && index === 1));
      });
      document.getElementById("form-login").classList.toggle("hidden", tab !== "login");
      document.getElementById("form-register").classList.toggle("hidden", tab !== "register");
    }

    function parseToken(token) {
      try {
        return JSON.parse(atob(token.split(".")[1]));
      } catch {
        return {};
      }
    }

    async function fetchJson(url, init = {}) {
      const response = await fetch(url, init);
      const text = await response.text();
      const data = text ? JSON.parse(text) : null;
      if (!response.ok) {
        throw new Error(data?.error_description || data?.msg || data?.message || text || "Request failed");
      }
      return data;
    }

    async function getUserRole(token) {
      const payload = parseToken(token);
      const userId = payload.sub;
      if (!userId) return "client";

      try {
        const data = await fetchJson(`${SB_URL}/rest/v1/profiles?select=role&id=eq.${userId}&limit=1`, {
          headers: { apikey: SB_KEY, Authorization: `Bearer ${token}` },
        });
        return data.length ? data[0].role : "client";
      } catch {
        return "client";
      }
    }

    async function upsertProfile(token, profile) {
      return fetchJson(`${SB_URL}/rest/v1/profiles?on_conflict=id`, {
        method: "POST",
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json",
          Prefer: "resolution=merge-duplicates,return=representation",
        },
        body: JSON.stringify(profile),
      });
    }

    async function patchClient(token, clientId, payload) {
      return fetchJson(`${SB_URL}/rest/v1/clients?id=eq.${clientId}`, {
        method: "PATCH",
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
        body: JSON.stringify(payload),
      });
    }

    async function createClient(token, payload) {
      return fetchJson(`${SB_URL}/rest/v1/clients`, {
        method: "POST",
        headers: {
          apikey: SB_KEY,
          Authorization: `Bearer ${token}`,
          "Content-Type": "application/json",
          Prefer: "return=representation",
        },
        body: JSON.stringify(payload),
      });
    }

    async function syncClientIdentity(token, user, seed = {}) {
      const payload = parseToken(token);
      const userId = user?.id || payload.sub;
      const email = user?.email || payload.email || seed.email || "";
      if (!userId) return;

      const [profileRows, clientRows] = await Promise.all([
        fetchJson(`${SB_URL}/rest/v1/profiles?select=id,full_name,phone,role&id=eq.${userId}&limit=1`, {
          headers: { apikey: SB_KEY, Authorization: `Bearer ${token}` },
        }).catch(() => []),
        fetchJson(`${SB_URL}/rest/v1/clients?select=*&auth_user_id=eq.${userId}&limit=1`, {
          headers: { apikey: SB_KEY, Authorization: `Bearer ${token}` },
        }).catch(() => []),
      ]);

      const profile = profileRows[0] || null;
      const fullName = seed.full_name || profile?.full_name || user?.user_metadata?.full_name || "";
      const phone = seed.phone || profile?.phone || user?.user_metadata?.phone || "";

      await upsertProfile(token, {
        id: userId,
        full_name: fullName,
        phone: phone || null,
        role: profile?.role || "client",
      }).catch(() => null);

      let client = clientRows[0] || null;
      if (!client && email) {
        const byEmail = await fetchJson(`${SB_URL}/rest/v1/clients?select=*&email=eq.${encodeURIComponent(email)}&order=created_at.asc&limit=1`, {
          headers: { apikey: SB_KEY, Authorization: `Bearer ${token}` },
        }).catch(() => []);
        client = byEmail[0] || null;
      }

      if (client) {
        const patch = {};
        if (client.auth_user_id !== userId) patch.auth_user_id = userId;
        if (fullName && fullName !== client.full_name) patch.full_name = fullName;
        if (phone && phone !== client.phone) patch.phone = phone;
        if (email && email !== client.email) patch.email = email;
        if (Object.keys(patch).length) {
          const fallbackPatch = { ...patch };
          delete fallbackPatch.auth_user_id;
          try {
            await patchClient(token, client.id, patch);
          } catch {
            if (Object.keys(fallbackPatch).length) {
              await patchClient(token, client.id, fallbackPatch).catch(() => null);
            }
          }
        }
        return;
      }

      const newClient = {
        full_name: fullName || "Clienta Vasca",
        phone: phone || "Sin teléfono",
        email: email || null,
        auth_user_id: userId,
      };

      try {
        await createClient(token, newClient);
      } catch {
        delete newClient.auth_user_id;
        await createClient(token, newClient).catch(() => null);
      }
    }

    async function checkSession() {
      const token = localStorage.getItem("vasca_token");
      if (!token) return;

      try {
        const user = await fetchJson(`${SB_URL}/auth/v1/user`, {
          headers: { apikey: SB_KEY, Authorization: `Bearer ${token}` },
        });

        await syncClientIdentity(token, user).catch(() => null);
        const role = await getUserRole(token);
        localStorage.setItem("vasca_role", role);
        if (role === "admin") window.location.href = "admin.html";
        else window.location.href = "turnos.html";
      } catch {
        localStorage.removeItem("vasca_token");
        localStorage.removeItem("vasca_refresh");
        localStorage.removeItem("vasca_user");
        localStorage.removeItem("vasca_role");
      }
    }

    async function handleLogin(event) {
      event.preventDefault();
      const button = document.getElementById("btn-login");
      const status = document.getElementById("login-status");
      button.disabled = true;
      status.textContent = "Verificando...";
      status.className = "status";

      try {
        const email = document.getElementById("login-email").value;
        const password = document.getElementById("login-pass").value;

        const data = await fetchJson(`${SB_URL}/auth/v1/token?grant_type=password`, {
          method: "POST",
          headers: { apikey: SB_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({ email, password }),
        });

        localStorage.setItem("vasca_token", data.access_token);
        localStorage.setItem("vasca_refresh", data.refresh_token);
        localStorage.setItem("vasca_user", JSON.stringify(data.user));

        await syncClientIdentity(data.access_token, data.user, { email }).catch(() => null);
        const role = await getUserRole(data.access_token);
        localStorage.setItem("vasca_role", role);

        status.textContent = "✓ Bienvenida";
        status.className = "status success";

        setTimeout(() => {
          window.location.href = role === "admin" ? "admin.html" : "turnos.html";
        }, 450);
      } catch (error) {
        status.textContent = `✕ ${error.message}`;
        status.className = "status error";
        button.disabled = false;
      }
    }

    async function handleRegister(event) {
      event.preventDefault();
      const button = document.getElementById("btn-register");
      const status = document.getElementById("reg-status");
      button.disabled = true;
      status.textContent = "Creando cuenta...";
      status.className = "status";

      try {
        const fullName = document.getElementById("reg-name").value.trim();
        const phone = document.getElementById("reg-phone").value.trim();
        const email = document.getElementById("reg-email").value;
        const password = document.getElementById("reg-pass").value;

        const data = await fetchJson(`${SB_URL}/auth/v1/signup`, {
          method: "POST",
          headers: { apikey: SB_KEY, "Content-Type": "application/json" },
          body: JSON.stringify({
            email,
            password,
            data: { full_name: fullName, phone, role: "client" },
          }),
        });

        if (data.access_token) {
          localStorage.setItem("vasca_token", data.access_token);
          localStorage.setItem("vasca_refresh", data.refresh_token);
          localStorage.setItem("vasca_user", JSON.stringify(data.user));
          localStorage.setItem("vasca_role", "client");

          await syncClientIdentity(data.access_token, data.user, {
            full_name: fullName,
            phone,
            email,
          }).catch(() => null);

          status.textContent = "✓ Cuenta creada";
          status.className = "status success";
          setTimeout(() => { window.location.href = "turnos.html"; }, 450);
          return;
        }

        status.textContent = "✓ Revisá tu email para confirmar la cuenta";
        status.className = "status success";
        button.disabled = false;
      } catch (error) {
        status.textContent = `✕ ${error.message}`;
        status.className = "status error";
        button.disabled = false;
      }
    }

    checkSession();
  </script>
</body>
</html>
